name: Help support my Imou robot
description: Share your robot model and diagnostics so another Imou robot vacuum can be supported or verified.
title: "[Model]: "
labels:
  - enhancement
body:
  - type: markdown
    attributes:
      value: |
        Only the Imou RV-L11-A (L11 series) has been verified on a real robot. Other Imou robot vacuums may work if their things model uses the same identifiers, but that is unverified. The diagnostics file contains the robot's things model and its current values, which is what is needed to map a new model.

        **Check what you share.** The integration redacts your App ID and App Secret in the diagnostics download and leaves out the robot's serial number and name. Still, open the file yourself and check it before you attach it. Never share your App Secret, access tokens or the robot's safety code.
  - type: input
    id: robot_model
    attributes:
      label: Robot model name
      description: "As printed on the robot or shown in the Imou app."
      placeholder: "Imou RV-L11-A"
    validations:
      required: true
  - type: dropdown
    id: current_state
    attributes:
      label: What happens at the moment?
      options:
        - The integration sets up and everything seems to work
        - The integration sets up, but some entities or commands do not work
        - The integration sets up, but no vacuum entity appears
        - Setup fails
    validations:
      required: true
  - type: textarea
    id: details
    attributes:
      label: What works and what does not?
      description: "For example start, pause, return to dock, locate, suction, water level, battery, cleaned area. Mention values that look wrong."
  - type: textarea
    id: diagnostics
    attributes:
      label: Diagnostics file
      description: |
        Go to Settings > Devices & services > Imou Robot Vacuum, open the three-dot menu and choose Download diagnostics. Drag the file into this box. If GitHub does not accept the .json file, zip it or rename it to .txt first.
        If nothing can be downloaded (for example because setup fails), say so here and add the log.
    validations:
      required: true
  - type: input
    id: ha_version
    attributes:
      label: Home Assistant version
      description: "Settings > About."
      placeholder: "2026.10.2"
  - type: input
    id: integration_version
    attributes:
      label: Integration version
      description: "Shown in HACS. For a manual install, it is the version in custom_components/imou_robot/manifest.json."
      placeholder: "0.1.2"
  - type: checkboxes
    id: privacy_check
    attributes:
      label: Privacy check
      options:
        - label: I checked the diagnostics file and removed anything I do not want to share.
          required: true
